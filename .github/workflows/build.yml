name: Gerar Aplicativo FLAC Player

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Montar Estrutura do Projeto
        run: |
          mkdir -p app/src/main/java/com/enrico/flacplayer
          cp MainActivity.kt app/src/main/java/com/enrico/flacplayer/MainActivity.kt

          printf 'pluginManagement {\n  repositories {\n    google()\n    mavenCentral()\n    gradlePluginPortal()\n  }\n}\ndependencyResolutionManagement {\n  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n  repositories {\n    google()\n    mavenCentral()\n  }\n}\nrootProject.name = "MeuPlayerFlac"\ninclude(":app")\n' > settings.gradle

          printf 'plugins {\n  id("com.android.application") version "8.2.0" apply false\n  id("org.jetbrains.kotlin.android") version "1.9.22" apply false\n}\n' > build.gradle

          printf 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nkotlin.code.style=official\nandroid.nonTransitiveRClass=true\n' > gradle.properties

          printf 'plugins {\n  id("com.android.application")\n  id("org.jetbrains.kotlin.android")\n}\nandroid {\n  namespace = "com.enrico.flacplayer"\n  compileSdk = 34\n  defaultConfig {\n    applicationId = "com.enrico.flacplayer"\n    minSdk = 26\n    targetSdk = 34\n    versionCode = 1\n    versionName = "1.0"\n  }\n  compileOptions {\n    sourceCompatibility = JavaVersion.VERSION_17\n    targetCompatibility = JavaVersion.VERSION_17\n  }\n  kotlinOptions {\n    jvmTarget = "17"\n  }\n  buildFeatures {\n    compose = true\n  }\n  composeOptions {\n    kotlinCompilerExtensionVersion = "1.5.8"\n  }\n}\ndependencies {\n  implementation(platform("androidx.compose:compose-bom:2024.02.00"))\n  implementation("androidx.compose.ui:ui")\n  implementation("androidx.compose.material3:material3")\n  implementation("androidx.activity:activity-compose:1.8.2")\n  implementation("androidx.media3:media3-exoplayer:1.2.1")\n  implementation("androidx.media3:media3-common:1.2.1")\n}\n' > app/build.gradle

          printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n  <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n  <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n  <application android:label="Enrico FLAC" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">\n    <activity android:name=".MainActivity" android:exported="true">\n      <intent-filter>\n        <action android:name="android.intent.action.MAIN" />\n        <category android:name="android.intent.category.LAUNCHER" />\n      </intent-filter>\n    </activity>\n  </application>\n</manifest>\n' > app/src/main/AndroidManifest.xml

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Enrico-FLAC-Player-APK
          path: app/build/outputs/apk/debug/app-debug.apk
