name: Gerar Aplicativo FLAC Player

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar processador de imagem
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Montar Projeto e Compilar APK
        run: |
          mkdir -p app/src/main/java/com/enrico/flacplayer
          cp MainActivity.kt app/src/main/java/com/enrico/flacplayer/MainActivity.kt

          # Localiza a imagem enviada (icon.png ou icon.jpg)
          ICONE=""
          for f in icon.png Icon.png icon.jpg Icon.jpg icon.jpeg *.png *.jpg; do
            if [ -f "$f" ]; then
              ICONE="$f"
              break
            fi
          done

          if [ -n "$ICONE" ]; then
            echo "Aplicando icone oficial a partir de: $ICONE"
            mkdir -p app/src/main/res/mipmap-mdpi
            mkdir -p app/src/main/res/mipmap-hdpi
            mkdir -p app/src/main/res/mipmap-xhdpi
            mkdir -p app/src/main/res/mipmap-xxhdpi
            mkdir -p app/src/main/res/mipmap-xxxhdpi

            convert "$ICONE" -resize 48x48! app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert "$ICONE" -resize 72x72! app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert "$ICONE" -resize 96x96! app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert "$ICONE" -resize 144x144! app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert "$ICONE" -resize 192x192! app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

            cp app/src/main/res/mipmap-mdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher_round.png
            cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            cp app/src/main/res/mipmap-xhdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
            cp app/src/main/res/mipmap-xxhdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          fi

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MeuPlayerFlac"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.enrico.flacplayer'
              compileSdk 34
              defaultConfig {
                  applicationId "com.enrico.flacplayer"
                  minSdk 26
                  targetSdk 34
                  versionCode 6
                  versionName "1.5"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              buildFeatures {
                  compose true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion '1.5.8'
              }
          }
          dependencies {
              implementation platform('androidx.compose:compose-bom:2024.02.00')
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-common:1.2.1'
              implementation 'androidx.media3:media3-session:1.2.1'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <application
                  android:label="Enrico FLAC"
                  android:icon="@mipmap/ic_launcher"
                  android:
